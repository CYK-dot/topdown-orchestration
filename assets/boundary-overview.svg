<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="ce-overview-title ce-overview-desc">
  <title id="ce-overview-title">认知工程架构：源 prompt 与编译 prompt 构建 harness 组件</title>
  <desc id="ce-overview-desc">源 prompt 与平台无关，内部按机制面与资源面组织；编译 prompt 提供平台相关的构建规则；二者共同构建出 harness 组件，包含 agent、skill、tool 等产物，再安装到认知主体（LLM）上使用。</desc>

  <rect width="900" height="380" fill="#ffffff"/>

  <text x="30" y="38" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="20" font-weight="bold" fill="#0f172a" text-anchor="start">认知工程</text>

  <!-- 源 prompt -->
  <rect x="30" y="60" width="280" height="180" rx="14" fill="#f5f8fc" stroke="#64748b" stroke-width="2"/>
  <text x="48" y="90" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="17" font-weight="bold" fill="#334155" text-anchor="start">源 prompt</text>
  <text x="48" y="110" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b" text-anchor="start">平台无关 · 变化慢</text>

  <rect x="48" y="126" width="116" height="94" rx="8" fill="#ffffff" stroke="#b7c4d3" stroke-width="1.5"/>
  <text x="106" y="162" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">机制面</text>
  <text x="106" y="184" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">框架层</text>

  <rect x="176" y="126" width="116" height="94" rx="8" fill="#ffffff" stroke="#b7cde4" stroke-width="1.5"/>
  <text x="234" y="162" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#1e4a7a" text-anchor="middle">资源面</text>
  <text x="234" y="184" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="10" fill="#4a7ebb" text-anchor="middle">能力层</text>

  <!-- 编译 prompt -->
  <rect x="30" y="250" width="280" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="288" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="start">编译 prompt</text>
  <text x="48" y="310" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="10" fill="#64748b" text-anchor="start">平台相关构建规则</text>

  <!-- 汇合：源 + 编译 -->
  <line x1="310" y1="150" x2="330" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="310" y1="300" x2="330" y2="300" stroke="#64748b" stroke-width="1.5"/>
  <line x1="330" y1="150" x2="330" y2="300" stroke="#64748b" stroke-width="1.5"/>
  <line x1="330" y1="225" x2="342" y2="225" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="342,219 350,225 342,231" fill="#64748b"/>

  <!-- 构建 -->
  <rect x="350" y="185" width="120" height="80" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="410" y="230" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" font-weight="bold" fill="#334155" text-anchor="middle">构建</text>

  <!-- 产出 harness 组件 -->
  <line x1="470" y1="225" x2="520" y2="225" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="520,219 528,225 520,231" fill="#64748b"/>

  <rect x="530" y="100" width="190" height="250" rx="14" fill="#f2f7fe" stroke="#4a7ebb" stroke-width="2"/>
  <text x="548" y="132" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="16" font-weight="bold" fill="#1e4a7a" text-anchor="start">harness 组件</text>

  <rect x="548" y="160" width="154" height="48" rx="7" fill="#ffffff" stroke="#b7cde4" stroke-width="1.2"/>
  <text x="625" y="189" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">agent</text>
  <rect x="548" y="220" width="154" height="48" rx="7" fill="#ffffff" stroke="#b7cde4" stroke-width="1.2"/>
  <text x="625" y="249" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">skill</text>
  <rect x="548" y="280" width="154" height="48" rx="7" fill="#ffffff" stroke="#b7cde4" stroke-width="1.2"/>
  <text x="625" y="309" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="13.5" font-weight="600" fill="#1e293b" text-anchor="middle">tool</text>

  <!-- 安装到认知主体 -->
  <line x1="720" y1="225" x2="750" y2="225" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="750,219 758,225 750,231" fill="#64748b"/>
  <text x="740" y="210" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">安装</text>

  <rect x="760" y="140" width="120" height="170" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="820" y="210" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">认知主体</text>
  <text x="820" y="232" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">LLM</text>
</svg>
